{
  "apiVersion": "v1",
  "kind": "List",
  "items": [
    {
      "apiVersion": "v1",
      "kind": "PersistentVolumeClaim",
      "metadata": {
        "name": "postgres-data"
      },
      "spec": {
        "accessModes": [
          "ReadWriteOnce"
        ],
        "resources": {
          "requests": {
            "storage": "2Gi"
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "PersistentVolumeClaim",
      "metadata": {
        "name": "media-data"
      },
      "spec": {
        "accessModes": [
          "ReadWriteOnce"
        ],
        "resources": {
          "requests": {
            "storage": "1Gi"
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "PersistentVolumeClaim",
      "metadata": {
        "name": "auth-data"
      },
      "spec": {
        "accessModes": [
          "ReadWriteOnce"
        ],
        "resources": {
          "requests": {
            "storage": "100Mi"
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "PersistentVolumeClaim",
      "metadata": {
        "name": "redis-data"
      },
      "spec": {
        "accessModes": [
          "ReadWriteOnce"
        ],
        "resources": {
          "requests": {
            "storage": "100Mi"
          }
        }
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "postgres"
      },
      "spec": {
        "replicas": 1,
        "strategy": {
          "type": "Recreate"
        },
        "selector": {
          "matchLabels": {
            "app": "postgres"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "postgres"
            }
          },
          "spec": {
            "securityContext": {
              "runAsNonRoot": true,
              "runAsUser": 70,
              "runAsGroup": 70,
              "fsGroup": 70,
              "seccompProfile": {
                "type": "RuntimeDefault"
              }
            },
            "automountServiceAccountToken": false,
            "containers": [
              {
                "name": "postgres",
                "image": "nova-postgres-vector:local",
                "imagePullPolicy": "IfNotPresent",
                "ports": [
                  {
                    "containerPort": 5432
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "50m",
                    "memory": "64Mi"
                  },
                  "limits": {
                    "cpu": "1",
                    "memory": "1Gi"
                  }
                },
                "securityContext": {
                  "allowPrivilegeEscalation": false,
                  "capabilities": {
                    "drop": [
                      "ALL"
                    ]
                  }
                },
                "env": [
                  {
                    "name": "POSTGRES_USER",
                    "value": "nova"
                  },
                  {
                    "name": "POSTGRES_DB",
                    "value": "nova"
                  },
                  {
                    "name": "POSTGRES_PASSWORD",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "nova-db",
                        "key": "password"
                      }
                    }
                  },
                  {
                    "name": "PGDATA",
                    "value": "/var/lib/postgresql/data/pgdata"
                  }
                ],
                "volumeMounts": [
                  {
                    "name": "postgres-data",
                    "mountPath": "/var/lib/postgresql/data"
                  }
                ]
              }
            ],
            "volumes": [
              {
                "name": "postgres-data",
                "persistentVolumeClaim": {
                  "claimName": "postgres-data"
                }
              }
            ]
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "postgres"
      },
      "spec": {
        "selector": {
          "app": "postgres"
        },
        "ports": [
          {
            "port": 5432,
            "targetPort": 5432
          }
        ]
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "redis"
      },
      "spec": {
        "replicas": 1,
        "strategy": {
          "type": "Recreate"
        },
        "selector": {
          "matchLabels": {
            "app": "redis"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "redis"
            }
          },
          "spec": {
            "securityContext": {
              "runAsNonRoot": true,
              "runAsUser": 999,
              "runAsGroup": 999,
              "fsGroup": 999,
              "seccompProfile": {
                "type": "RuntimeDefault"
              }
            },
            "automountServiceAccountToken": false,
            "containers": [
              {
                "name": "redis",
                "image": "redis:7-alpine",
                "imagePullPolicy": "IfNotPresent",
                "ports": [
                  {
                    "containerPort": 6379
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "50m",
                    "memory": "64Mi"
                  },
                  "limits": {
                    "cpu": "1",
                    "memory": "1Gi"
                  }
                },
                "securityContext": {
                  "allowPrivilegeEscalation": false,
                  "capabilities": {
                    "drop": [
                      "ALL"
                    ]
                  }
                },
                "volumeMounts": [
                  {
                    "name": "redis-data",
                    "mountPath": "/data"
                  }
                ],
                "command": [
                  "redis-server",
                  "--appendonly",
                  "yes"
                ]
              }
            ],
            "volumes": [
              {
                "name": "redis-data",
                "persistentVolumeClaim": {
                  "claimName": "redis-data"
                }
              }
            ]
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "redis"
      },
      "spec": {
        "selector": {
          "app": "redis"
        },
        "ports": [
          {
            "port": 6379,
            "targetPort": 6379
          }
        ]
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "backend"
      },
      "spec": {
        "replicas": 1,
        "strategy": {
          "type": "Recreate"
        },
        "selector": {
          "matchLabels": {
            "app": "backend"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "backend"
            }
          },
          "spec": {
            "securityContext": {
              "runAsNonRoot": true,
              "runAsUser": 1000,
              "runAsGroup": 1000,
              "fsGroup": 1000,
              "seccompProfile": {
                "type": "RuntimeDefault"
              }
            },
            "automountServiceAccountToken": false,
            "containers": [
              {
                "name": "backend",
                "image": "nova-backend:latest",
                "imagePullPolicy": "IfNotPresent",
                "ports": [
                  {
                    "containerPort": 8000
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "50m",
                    "memory": "64Mi"
                  },
                  "limits": {
                    "cpu": "1",
                    "memory": "1Gi"
                  }
                },
                "securityContext": {
                  "allowPrivilegeEscalation": false,
                  "capabilities": {
                    "drop": [
                      "ALL"
                    ]
                  }
                },
                "env": [
                  {
                    "name": "DB_PASSWORD",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "nova-db",
                        "key": "password"
                      }
                    }
                  },
                  {
                    "name": "DATABASE_URL",
                    "value": "postgresql+psycopg://nova:$(DB_PASSWORD)@postgres:5432/nova"
                  },
                  {
                    "name": "REDIS_URL",
                    "value": "redis://redis:6379/0"
                  },
                  {
                    "name": "AUTH_MODE",
                    "value": "local"
                  },
                  {
                    "name": "AUTH_KEY_FILE",
                    "value": "/app/security/auth.key"
                  },
                  {
                    "name": "MEDIA_DIRECTORY",
                    "value": "/app/media"
                  },
                  {
                    "name": "ENABLE_EXTERNAL_MODEL_TESTS",
                    "value": "false"
                  },
                  {
                    "name": "OTEL_EXPORTER_OTLP_ENDPOINT",
                    "value": "http://collector:4318"
                  }
                ],
                "volumeMounts": [
                  {
                    "name": "media-data",
                    "mountPath": "/app/media"
                  },
                  {
                    "name": "auth-data",
                    "mountPath": "/app/security"
                  }
                ],
                "readinessProbe": {
                  "httpGet": {
                    "path": "/health/live",
                    "port": 8000
                  },
                  "initialDelaySeconds": 15,
                  "periodSeconds": 5
                }
              }
            ],
            "volumes": [
              {
                "name": "media-data",
                "persistentVolumeClaim": {
                  "claimName": "media-data"
                }
              },
              {
                "name": "auth-data",
                "persistentVolumeClaim": {
                  "claimName": "auth-data"
                }
              }
            ]
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "backend"
      },
      "spec": {
        "selector": {
          "app": "backend"
        },
        "ports": [
          {
            "port": 8000,
            "targetPort": 8000
          }
        ]
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "gateway"
      },
      "spec": {
        "replicas": 1,
        "strategy": {
          "type": "Recreate"
        },
        "selector": {
          "matchLabels": {
            "app": "gateway"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "gateway"
            }
          },
          "spec": {
            "securityContext": {
              "runAsNonRoot": true,
              "runAsUser": 1000,
              "runAsGroup": 1000,
              "fsGroup": 1000,
              "seccompProfile": {
                "type": "RuntimeDefault"
              }
            },
            "automountServiceAccountToken": false,
            "containers": [
              {
                "name": "gateway",
                "image": "nova-gateway:local",
                "imagePullPolicy": "IfNotPresent",
                "ports": [
                  {
                    "containerPort": 8080
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "50m",
                    "memory": "64Mi"
                  },
                  "limits": {
                    "cpu": "1",
                    "memory": "1Gi"
                  }
                },
                "securityContext": {
                  "allowPrivilegeEscalation": false,
                  "capabilities": {
                    "drop": [
                      "ALL"
                    ]
                  }
                },
                "env": [
                  {
                    "name": "BACKEND_URL",
                    "value": "http://backend:8000"
                  }
                ],
                "readinessProbe": {
                  "httpGet": {
                    "path": "/health/live",
                    "port": 8080
                  },
                  "initialDelaySeconds": 15,
                  "periodSeconds": 5
                }
              }
            ]
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "gateway"
      },
      "spec": {
        "selector": {
          "app": "gateway"
        },
        "ports": [
          {
            "port": 8080,
            "targetPort": 8080
          }
        ]
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "frontend"
      },
      "spec": {
        "replicas": 1,
        "strategy": {
          "type": "Recreate"
        },
        "selector": {
          "matchLabels": {
            "app": "frontend"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "frontend"
            }
          },
          "spec": {
            "securityContext": {
              "runAsNonRoot": true,
              "runAsUser": 1000,
              "runAsGroup": 1000,
              "fsGroup": 1000,
              "seccompProfile": {
                "type": "RuntimeDefault"
              }
            },
            "automountServiceAccountToken": false,
            "containers": [
              {
                "name": "frontend",
                "image": "nova-frontend:latest",
                "imagePullPolicy": "IfNotPresent",
                "ports": [
                  {
                    "containerPort": 3000
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "50m",
                    "memory": "64Mi"
                  },
                  "limits": {
                    "cpu": "1",
                    "memory": "1Gi"
                  }
                },
                "securityContext": {
                  "allowPrivilegeEscalation": false,
                  "capabilities": {
                    "drop": [
                      "ALL"
                    ]
                  }
                },
                "env": [
                  {
                    "name": "API_INTERNAL_URL",
                    "value": "http://gateway:8080"
                  },
                  {
                    "name": "NEXT_TELEMETRY_DISABLED",
                    "value": "1"
                  }
                ]
              }
            ]
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "frontend"
      },
      "spec": {
        "selector": {
          "app": "frontend"
        },
        "ports": [
          {
            "port": 3000,
            "targetPort": 3000
          }
        ]
      }
    }
  ]
}
