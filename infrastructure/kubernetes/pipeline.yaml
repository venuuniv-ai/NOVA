      "spec": {
        "backoffLimit": 12,
        "template": {
          "metadata": {
            "labels": {
              "app": "kafka-init"
            }
          },
          "spec": {
            "securityContext": {
              "runAsNonRoot": true,
              "runAsUser": 1000,
              "runAsGroup": 1000,
              "fsGroup": 1000,
              "seccompProfile": {
                "type": "RuntimeDefault"
              }
            },
            "automountServiceAccountToken": false,
            "containers": [
              {
                "name": "kafka",
                "image": "apache/kafka:4.0.1",
