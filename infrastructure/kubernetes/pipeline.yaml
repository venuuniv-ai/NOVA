      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "publisher"
      },
      "spec": {
        "replicas": 1,
        "strategy": {
          "type": "Recreate"
        },
        "selector": {
          "matchLabels": {
            "app": "publisher"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "publisher",
              "tier": "worker"
            }
          },
          "spec": {
            "securityContext": {
              "runAsNonRoot": true,
              "runAsUser": 1000,
              "runAsGroup": 1000,
              "fsGroup": 1000,
              "seccompProfile": {
                "type": "RuntimeDefault"
              }
            },
            "automountServiceAccountToken": false,
            "containers": [
              {
                "name": "publisher",
                "image": "nova-backend:latest",
                "imagePullPolicy": "IfNotPresent",
                "resources": {
                  "requests": {
                    "cpu": "50m",
                    "memory": "64Mi"
                  },
                  "limits": {
                    "cpu": "1",
                    "memory": "1Gi"
                  }
                },
                "securityContext": {
                  "allowPrivilegeEscalation": false,
                  "capabilities": {
                    "drop": [
                      "ALL"
                    ]
                  }
                },
                "env": [
                  {
                    "name": "DB_PASSWORD",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "nova-db",
                        "key": "password"
                      }
                    }
                  },
                  {
                    "name": "DATABASE_URL",
                    "value": "postgresql+psycopg://nova:$(DB_PASSWORD)@postgres:5432/nova"
                  },
                  {
                    "name": "REDIS_URL",
                    "value": "redis://redis:6379/0"
                  },
                  {
                    "name": "MEDIA_DIRECTORY",
                    "value": "/app/media"
                  },
                  {
                    "name": "ENABLE_EXTERNAL_MODEL_TESTS",
                    "value": "false"
                  },
                  {
                    "name": "KAFKA_BOOTSTRAP_SERVERS",
                    "value": "kafka:9092"
                  },
                  {
                    "name": "OTEL_EXPORTER_OTLP_ENDPOINT",
                    "value": "http://collector:4318"
                  },
                  {
                    "name": "OTEL_SERVICE_NAME",
                    "value": "nova-event-worker"
                  }
                ],
                "command": [
                  "python",
                  "-m",
                  "app.events.worker",
                  "publisher"
                ]
              }
            ]
          }
        }
      }
    },
