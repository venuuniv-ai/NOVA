        "datasources.yaml": "apiVersion: 1\ndatasources:\n  - name: Local Prometheus\n    uid: nova-prometheus\n    type: prometheus\n    access: proxy\n    url: http://prometheus:9090\n    isDefault: true\n  - name: Local Tempo\n    uid: nova-tempo\n    type: tempo\n    access: proxy\n    url: http://tempo:3200\n",
        "provider.yaml": "apiVersion: 1\nproviders:\n  - name: NOVA local\n    folder: NOVA\n    type: file\n    options:\n      path: /etc/grafana/provisioning/dashboards\n",
        "nova.json": "{\"uid\":\"nova-local\",\"title\":\"NOVA Local HTTP\",\"schemaVersion\":39,\"version\":1,\"panels\":[{\"id\":1,\"type\":\"timeseries\",\"title\":\"Actual HTTP requests / second\",\"datasource\":{\"type\":\"prometheus\",\"uid\":\"nova-prometheus\"},\"targets\":[{\"expr\":\"sum(rate(nova_http_requests_total[1m]))\",\"refId\":\"A\"}],\"gridPos\":{\"h\":8,\"w\":12,\"x\":0,\"y\":0}},{\"id\":2,\"type\":\"timeseries\",\"title\":\"HTTP P95 seconds\",\"datasource\":{\"type\":\"prometheus\",\"uid\":\"nova-prometheus\"},\"targets\":[{\"expr\":\"histogram_quantile(0.95,sum by(le)(rate(nova_http_duration_seconds_bucket[1m])))\",\"refId\":\"A\"}],\"gridPos\":{\"h\":8,\"w\":12,\"x\":12,\"y\":0}}]}\n"
      }
    },
