                "resources": {
                  "requests": {
                    "cpu": "50m",
                    "memory": "64Mi"
                  },
                  "limits": {
                    "cpu": "1",
                    "memory": "1Gi"
                  }
                },
                "securityContext": {
                  "allowPrivilegeEscalation": false,
                  "capabilities": {
                    "drop": [
                      "ALL"
                    ]
                  }
                },
                "env": [
                  {
                    "name": "KAFKA_NODE_ID",
                    "value": "1"
                  },
                  {
                    "name": "KAFKA_PROCESS_ROLES",
                    "value": "broker,controller"
                  },
                  {
                    "name": "KAFKA_LISTENERS",
                    "value": "PLAINTEXT://:9092,CONTROLLER://:9093"
                  },
                  {
                    "name": "KAFKA_ADVERTISED_LISTENERS",
                    "value": "PLAINTEXT://kafka:9092"
                  },
                  {
                    "name": "KAFKA_CONTROLLER_LISTENER_NAMES",
                    "value": "CONTROLLER"
                  },
                  {
                    "name": "KAFKA_LISTENER_SECURITY_PROTOCOL_MAP",
                    "value": "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
                  },
                  {
                    "name": "KAFKA_CONTROLLER_QUORUM_VOTERS",
                    "value": "1@kafka:9093"
                  },
                  {
                    "name": "KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR",
                    "value": "1"
                  },
                  {
                    "name": "KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR",
                    "value": "1"
                  },
                  {
                    "name": "KAFKA_TRANSACTION_STATE_LOG_MIN_ISR",
                    "value": "1"
                  },
                  {
                    "name": "KAFKA_AUTO_CREATE_TOPICS_ENABLE",
                    "value": "false"
                  },
                  {
                    "name": "KAFKA_LOG_DIRS",
                    "value": "/var/lib/kafka/data"
                  },
                  {
                    "name": "CLUSTER_ID",
                    "value": "MkU3OEVBNTcwNTJENDM2Qk"
                  },
                  {
                    "name": "KAFKA_HEAP_OPTS",
                    "value": "-Xms128m -Xmx512m"
                  }
                ],
                "command": [
                  "/opt/kafka/bin/kafka-topics.sh",
                  "--bootstrap-server",
                  "kafka:9092",
                  "--create",
                  "--if-not-exists",
                  "--topic",
                  "nova.events.v1",
                  "--partitions",
                  "3",
                  "--replication-factor",
                  "1"
                ]
              }
            ],
            "restartPolicy": "OnFailure"
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "ConfigMap",
      "metadata": {
        "name": "collector-config"
      },
      "data": {
        "collector.yaml": "receivers:\n  otlp:\n    protocols:\n      http:\n        endpoint: 0.0.0.0:4318\nprocessors:\n  memory_limiter:\n    check_interval: 1s\n    limit_mib: 128\n  batch:\n    timeout: 2s\nexporters:\n  otlphttp/tempo:\n    endpoint: http://tempo:4318\n    tls:\n      insecure: true\n  prometheus:\n    endpoint: 0.0.0.0:8889\nservice:\n  pipelines:\n    traces:\n      receivers: [otlp]\n      processors: [memory_limiter, batch]\n      exporters: [otlphttp/tempo]\n    metrics:\n      receivers: [otlp]\n      processors: [memory_limiter, batch]\n      exporters: [prometheus]\n"
      }
    },
    {
      "apiVersion": "v1",
      "kind": "ConfigMap",
      "metadata": {
        "name": "prometheus-config"
      },
      "data": {
        "prometheus.yaml": "global:\n  scrape_interval: 5s\nscrape_configs:\n  - job_name: nova-otel\n    static_configs:\n      - targets: [collector:8889]\n"
      }
    },
    {
      "apiVersion": "v1",
      "kind": "ConfigMap",
      "metadata": {
        "name": "tempo-config"
      },
      "data": {
        "tempo.yaml": "server:\n  http_listen_port: 3200\ndistributor:\n  receivers:\n    otlp:\n      protocols:\n        http:\n          endpoint: 0.0.0.0:4318\ningester:\n  max_block_duration: 1m\ncompactor:\n  compaction:\n    block_retention: 24h\nstorage:\n  trace:\n    backend: local\n    wal:\n      path: /tmp/tempo/wal\n    local:\n      path: /tmp/tempo/blocks\n"
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "collector"
      },
      "spec": {
        "replicas": 1,
        "strategy": {
          "type": "Recreate"
        },
        "selector": {
          "matchLabels": {
            "app": "collector"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "collector"
            }
          },
          "spec": {
            "securityContext": {
              "runAsNonRoot": true,
              "runAsUser": 1000,
              "runAsGroup": 1000,
              "fsGroup": 1000,
              "seccompProfile": {
                "type": "RuntimeDefault"
              }
            },
            "automountServiceAccountToken": false,
            "containers": [
              {
                "name": "collector",
                "image": "otel/opentelemetry-collector-contrib:0.138.0",
                "imagePullPolicy": "IfNotPresent",
                "resources": {
                  "requests": {
                    "cpu": "50m",
                    "memory": "64Mi"
                  },
                  "limits": {
                    "cpu": "1",
                    "memory": "1Gi"
                  }
                },
                "securityContext": {
                  "allowPrivilegeEscalation": false,
                  "capabilities": {
                    "drop": [
                      "ALL"
                    ]
                  }
                },
                "command": [
                  "/otelcol-contrib",
                  "--config=/etc/nova/collector.yaml"
                ],
                "volumeMounts": [
                  {
                    "name": "config",
                    "mountPath": "/etc/nova",
                    "readOnly": true
                  }
                ],
                "ports": [
                  {
                    "containerPort": 4318
                  }
                ]
              }
            ],
            "volumes": [
